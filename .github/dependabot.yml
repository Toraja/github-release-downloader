version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-compatible:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    exclude-paths:
      - ".github/workflows/release.yml"
    groups:
      github-actions-compatible:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
